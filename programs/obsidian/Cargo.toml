[package]
name = "obsidian"
version = "0.1.0"
description = "Obsidian — Privacy-Preserving Blind Auction on Solana powered by Arcium v0.7.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "obsidian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["token_2022"] }
arcium-anchor = "0.7"
arcium-macros = "0.7"
arcium-client = "0.7"
blake3 = "=1.5.5"
spl-token-2022 = { version = "3.0.4", default-features = false, features = ["no-entrypoint"] }
