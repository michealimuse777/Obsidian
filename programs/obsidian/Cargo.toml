[package]
name = "obsidian"
version = "0.1.0"
description = "Obsidian — Privacy-Preserving Blind Auction on Solana powered by Arcium"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "obsidian"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
arcium-anchor = "0.8"
arcium-macros = "0.8"
arcium-client = { version = "0.8", default-features = false }
